[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eudamed-lookup"
version = "1.0.0"
description = "Query the official EUDAMED Public API v1.0 for medical device registrations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
eudamed = "eudamed.cli:main"

[tool.setuptools]
packages = ["eudamed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

# Pinned explicitly: ruff's default rule set changes between releases (0.16
# added UP/SIM/RUF/BLE/I to the defaults), so an unpinned config lints
# differently on different machines and disagrees with CI.
[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["eudamed"]

[tool.ruff.lint.per-file-ignores]
# report.py and webui.py each embed a page as one template string; the CSS
# rules and JS expressions inside are not Python, and reflowing them to 100
# columns hurts readability rather than helping it.
"eudamed/report.py" = ["E501"]
"eudamed/webui.py" = ["E501"]
